name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Send request to Supabase
        run: |
          response=$(curl --silent --show-error --fail \
            --request POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/keep-alive" \
            --header "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            --header "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{}')

          echo "Supabase response:"
          echo "$response"